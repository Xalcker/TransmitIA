# Compila e instala GStreamer por plataforma y genera los instaladores.
# Se ejecuta a mano (Actions → build → Run workflow) o al crear un tag v*.
name: build

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "macOS (los minutos cuentan x10 en repos privados)"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: true
      linux:
        description: "Linux"
        type: boolean
        default: true
  push:
    tags: ["v*"]

env:
  # Versión de GStreamer para Windows (instaladores oficiales MSVC).
  GST_WIN_VERSION: "1.28.1"

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-14 # Apple Silicon; el .app resultante requiere macOS 14+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: GStreamer (Homebrew)
        run: brew install gstreamer pkg-config
      - run: npm ci
      - name: Build + empaquetar GStreamer dentro del .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TransmitIA-macos
          path: src-tauri/target/release/bundle/*.dmg

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias (Tauri + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-x gstreamer1.0-pulseaudio \
            gstreamer1.0-plugins-rs glib-networking libsecret-1-dev libdbus-1-dev
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: TransmitIA-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: GStreamer MSVC (runtime + desarrollo)
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_WIN_VERSION/msvc"
          foreach ($f in @("gstreamer-1.0-msvc-x86_64-$env:GST_WIN_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_WIN_VERSION.msi")) {
            Invoke-WebRequest "$base/$f" -OutFile $f
            Start-Process msiexec -Wait -ArgumentList "/i", $f, "/qn", "ADDLOCAL=ALL", "INSTALLDIR=C:\gstreamer"
          }
          choco install pkgconfiglite -y
          "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: TransmitIA-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
